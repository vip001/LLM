[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-common"
version = "0.1.0"
description = "Shared RAG, vector store, and embedding utilities for llm server and MCP"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2",
    "SQLAlchemy>=2.0.44,<3",
    "asyncpg>=0.30.0,<1",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    # slim 镜像无系统 libpq；[binary] 提供预编译 libpq，否则 psycopg 无法加载
    "psycopg[binary]>=3.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-experimental>=0.3.0",
    "faiss-cpu>=1.9.0",
    "dashscope>=1.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_common"]
