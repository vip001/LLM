# 与 docker-compose.yml / docker-compose.aliyun.yml 中 llm_net 固定 IP 一致（webui=172.28.240.10）。
# 浏览器访问用 ECS 公网 IP 或 VPC 内网 IP（如 172.31.163.115）的 80 端口，不要写进 upstream。
# 多副本：在 compose 里为各 webui 分配 ipv4_address，并在此 upstream 中增加 server 行。
upstream loadbalance {
    server 172.28.240.10:3000 weight=1;
}

# Access log in JSON format for IP analytics/reporting.
log_format access_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","realip_remote_addr":"$realip_remote_addr",'
    '"xff":"$http_x_forwarded_for","method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"referer":"$http_referer","ua":"$http_user_agent","rt":$request_time}';

# Trust upstream proxy/LB to restore real client IP when applicable.
# If Nginx is directly exposed to the Internet, $remote_addr is already the client IP.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per-client IP request rate limiting.
limit_req_zone $binary_remote_addr zone=per_ip_rate:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log access_json;

    # Keep uploads and streamed responses usable for chat APIs.
    client_max_body_size 20m;
    limit_req zone=per_ip_rate burst=20 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://loadbalance;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
