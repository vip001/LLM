networks:
  llm_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.240.0/24

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: llm-server
    env_file:
      - .env
    expose:
      - "5000"
    volumes:
      - ./server/chromastore:/app/server/chromastore
      - ./server/pdf:/app/server/pdf
    restart: unless-stopped
    networks:
      llm_net:
        ipv4_address: 172.28.240.11
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=4)",
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 600s

  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    container_name: llm-webui
    depends_on:
      server:
        condition: service_healthy
    environment:
      FLASK_ASK_URL: http://server:5000/ask
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      llm_net:
        ipv4_address: 172.28.240.10

  nginx:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: llm-nginx
    depends_on:
      - webui
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - llm_net
