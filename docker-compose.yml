networks:
  llm_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.240.0/24

volumes:
  loginserver_pg_data:

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: llm-server
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      # LangGraph 多轮会话 checkpoint（与 loginserver 共用同一库）；可在 .env 中覆盖 LANGGRAPH_CHECKPOINT_DB_URI
      LANGGRAPH_CHECKPOINT_DB_URI: ${LANGGRAPH_CHECKPOINT_DB_URI:-postgresql://loginserver:loginserver@postgres:5432/loginserver?sslmode=disable}
    expose:
      - "5000"
    volumes:
      - ./server/vectorstore:/app/server/vectorstore
      - ./server/pdf:/app/server/pdf
    restart: unless-stopped
    networks:
      llm_net:
        ipv4_address: 172.28.240.11

  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    container_name: llm-webui
    depends_on:
      server:
        condition: service_started
      loginserver:
        condition: service_started
    environment:
      FLASK_ASK_URL: http://server:5000/ask
      NEXT_PUBLIC_AUTH_BASE_URL: /auth
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      llm_net:
        ipv4_address: 172.28.240.10

  loginserver:
    build:
      context: .
      dockerfile: loginserver/Dockerfile
    container_name: llm-loginserver
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_SOCKET_PATH: ""
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: loginserver
      PG_PASSWORD: loginserver
      PG_DATABASE: loginserver
      PG_SOCKET_DIR: ""
      ALLOWED_ORIGINS: "*"
      ENABLE_DEBUG_CODE: "1"
      # 写入 /auth/mcp-token 返回的 MCP 配置，须为客户端可访问的绝对 URL（经 nginx 的 /mcp）。
      # 云上部署在 .env 中设置 MCP_SERVER_URL=https://你的域名/mcp
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://localhost/mcp}
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      llm_net:
        ipv4_address: 172.28.240.12

  mcpserver:
    build:
      context: .
      dockerfile: mcpserver/Dockerfile
    container_name: llm-mcpserver
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: loginserver
      PG_PASSWORD: loginserver
      PG_DATABASE: loginserver
      PG_SOCKET_DIR: ""
    ports:
      - "8001:8001"
    volumes:
      - ./server/vectorstore:/app/server/vectorstore
    restart: unless-stopped
    networks:
      llm_net:
        ipv4_address: 172.28.240.15

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: llm-login-redis
    restart: unless-stopped
    networks:
      llm_net:
        ipv4_address: 172.28.240.13

  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: llm-login-postgres
    environment:
      POSTGRES_USER: loginserver
      POSTGRES_PASSWORD: loginserver
      POSTGRES_DB: loginserver
    volumes:
      - loginserver_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      llm_net:
        ipv4_address: 172.28.240.14

  nginx:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: llm-nginx
    depends_on:
      - webui
      - loginserver
      - server
      - mcpserver
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - llm_net
