[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-mcpserver"
version = "0.1.0"
description = "MCP server (FastMCP) exposing RAG retrieval contexts for the llm repo"
requires-python = ">=3.12"
dependencies = [
    # Path is relative to cwd: use from mcpserver/ → pip install -e .
    # From repo root (llm/): pip install -e ./mcpserver breaks this URL; use
    #   pip install -e ./llm_common && (cd mcpserver && pip install -e .)
    # or only: cd mcpserver && pip install -e .
    "llm-common @ file:../llm_common",
    "fastmcp>=3.2",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-experimental>=0.3.0",
    "langchain-mcp-adapters>=0.2.0",
    "faiss-cpu>=1.9.0",
    "pypdf>=4.0.0",
    "Pillow>=10.0.0",
    "dashscope>=1.20.0",
]

[project.scripts]
llm-mcp = "llm_mcpserver.mcpserver:main"

[tool.hatch.metadata]
allow-direct-references = true
